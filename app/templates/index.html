<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>When Hands Talk — Sign to Speech</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h2>🤟 When Hands Talk</h2>
    <p class="note">Real-time sign language recognition → text → speech</p>

    <div class="video-row">
      <video id="video" width="360" height="270" autoplay playsinline></video>
      <canvas id="canvas" width="360" height="270" style="display:none;"></canvas>
    </div>

    <div class="controls">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" disabled>Stop Camera</button>
      <label>Interval (ms): <input id="interval" type="number" value="400" min="100" step="50"></label>
    </div>

    <div class="result">
      <p>Current sign: <strong id="label">-</strong> (confidence: <span id="conf">0.00</span>)</p>
      <p>Sentence: <strong id="sentence"></strong></p>
      <button id="speakBtn">🔊 Speak</button>
      <button id="clearBtn">🗑️ Clear</button>
    </div>

    <p class="note">Tip: hold each sign steady for about a second so it has time to lock in.</p>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
